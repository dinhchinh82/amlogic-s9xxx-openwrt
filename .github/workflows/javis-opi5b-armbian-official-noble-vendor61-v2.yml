# JAVIS AI Box - Source build with the OFFICIAL Armbian build framework.
# Target: Orange Pi 5B (RK3588S), Ubuntu 24.04 Noble, Rockchip BSP vendor 6.1.
# This is NOT an Ophub "rebuild" and does not patch an existing image.
# References:
# https://github.com/armbian/build/blob/main/action.yml
# https://github.com/armbian/build/blob/main/config/boards/orangepi5b.csc
# https://github.com/armbian/build/blob/main/config/sources/families/rockchip-rk3588.conf
name: JAVIS - Official Armbian OPi5B Noble Vendor 6.1

on:
  workflow_dispatch:
    inputs:
      image_variant:
        description: 'Image type: minimal for AI appliances, server for full CLI tools'
        type: choice
        required: true
        default: minimal
        options:
          - minimal
          - server

permissions:
  contents: write

concurrency:
  group: javis-official-opi5b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Orange Pi 5B | Ubuntu 24.04 | vendor 6.1 | ${{ inputs.image_variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Use Armbian's own composite action. It checks out armbian/os and
      # armbian/build, compiles/builds via compile.sh, then creates a Release.
      - name: Build OS from official Armbian source
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: build
          armbian_board: orangepi5b
          armbian_release: noble
          armbian_kernel_branch: vendor
          armbian_ui: ${{ inputs.image_variant }}
          armbian_runner_clean: 'yes'
          armbian_compress: 'sha,img,xz'
          armbian_release_title: 'JAVIS TEST - Armbian Official Orange Pi 5B Ubuntu 24.04 vendor 6.1'
          armbian_release_body: |
            Built with the official Armbian build framework, for Orange Pi 5B (RK3588S).
            Ubuntu Noble 24.04; BRANCH=vendor (Rockchip BSP 6.1); no Ophub rebuild.
            TEST IMAGE ONLY: verify boot, rknpu, RKNN, MPP, RGA, thermals and long-running AI workloads before production.
          armbian_release_tag: javis-opi5b-noble-vendor61-${{ inputs.image_variant }}-${{ github.run_number }}
          armbian_release_prerelease: 'true'
          # Correct download URLs in the Armbian assets manifest for GitHub Releases.
          armbian_download_base_url: https://github.com/${{ github.repository }}/releases/download/javis-opi5b-noble-vendor61-${{ inputs.image_variant }}-${{ github.run_number }}
          armbian_download_repository: '/'

      # Build + publication were already completed inside the Armbian Action.
      # This step verifies the generated file without relying on fragile parsing
      # of a particular upstream kernel config layout.
      - name: Verify generated image and record source versions
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Armbian build framework revision ==='
          git -C build rev-parse HEAD
          echo '=== Board configuration ==='
          board_cfg='build/config/boards/orangepi5b.csc'
          if [[ -f "$board_cfg" ]]; then
            grep -E '^(BOARD_NAME|BOARDFAMILY|KERNEL_TARGET|BOOT_FDT_FILE)=' "$board_cfg" || true
          else
            echo '::warning::Board config not found for metadata inspection'
          fi

          echo '=== Rockchip vendor kernel source (informational only) ==='
          common_cfg='build/config/sources/families/include/rockchip_vendor_common.inc'
          if [[ -f "$common_cfg" ]]; then
            grep -E 'KERNEL_MAJOR_MINOR=|KERNELSOURCE=|KERNELBRANCH=|KERNELPATCHDIR=' "$common_cfg" || true
          else
            echo '::warning::Vendor kernel config path changed; build was already successful'
          fi

          echo '=== Output files ==='
          image_dir='build/output/images'
          if [[ ! -d "$image_dir" ]]; then
            echo '::warning::Local output directory not present after action; check GitHub Releases'
            exit 0
          fi
          find "$image_dir" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

          # Do not assume the exact prefix, version or capitalization of Armbian filename.
          mapfile -t candidates < <(find "$image_dir" -maxdepth 1 -type f -name '*.img.xz' | sort)
          valid=()
          for candidate in "${candidates[@]}"; do
            basename_lower="$(basename "$candidate" | tr '[:upper:]' '[:lower:]')"
            if [[ "$basename_lower" == *orangepi5b* && "$basename_lower" == *noble* && "$basename_lower" == *vendor* ]]; then
              valid+=("$candidate")
            fi
          done
          if (( ${#valid[@]} != 1 )); then
            echo "::error::Expected 1 Orange Pi 5B Noble vendor .img.xz; found ${#valid[@]}"
            echo 'Check the artifacts in the GitHub Release created by the Armbian Action.'
            exit 1
          fi
          image="${valid[0]}"
          echo "Verified expected image: $image"
          xz -t "$image"
          sha256sum "$image"

          {
            echo '## JAVIS Armbian build validation'
            echo "- Board: orangepi5b"
            echo "- OS: Ubuntu Noble 24.04"
            echo "- Kernel branch: vendor (Rockchip BSP 6.1 target)"
            echo "- Armbian framework commit: \`$(git -C build rev-parse HEAD)\`"
            echo "- Image: \`$(basename "$image")\`"
            echo '- File compression: validated with xz -t'
            echo '- Important: kernel version and RKNN functionality must still be tested on the Orange Pi 5B.'
          } >> "$GITHUB_STEP_SUMMARY"
